name: Daily pipeline
on:
  schedule:
    - cron: "17 6 * * *" # 06:17 UTC; off the top of the hour, when GitHub schedules are most delayed
  workflow_dispatch: # "Run workflow" button for manual runs
concurrency:
  group: pipeline
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm install -g @anthropic-ai/claude-code
      - name: Run pipeline
        run: npx tsx scripts/pipeline/run.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }} # only used when ANALYSIS_BACKEND=api
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT || secrets.SEC_USER_AGENT }}
          ANALYSIS_BACKEND: ${{ vars.ANALYSIS_BACKEND || 'claude-code' }}
          CLAUDE_CODE_MODEL: ${{ vars.CLAUDE_CODE_MODEL || 'sonnet' }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          MAX_ANALYSES_PER_RUN: ${{ vars.MAX_ANALYSES_PER_RUN }}
          ANALYSIS_CONCURRENCY: ${{ vars.ANALYSIS_CONCURRENCY }}
          FORM_D_MIN_OFFERING: ${{ vars.FORM_D_MIN_OFFERING }}
          JOBS_RUN_EVERY_N_DAYS: ${{ vars.JOBS_RUN_EVERY_N_DAYS }}
